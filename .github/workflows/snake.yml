name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: XzGuuhXz
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=58A6FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=A371F7

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
